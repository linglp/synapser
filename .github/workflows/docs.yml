# build the pkgdown site and publish it to the gh-pages branch, which GitHub
# Pages serves. Every build owns one folder, so the versions live side by side:
#
#   push to develop   -> latest/
#   push to master    -> stable/
#   release X.Y.Z     -> vX.Y.Z/
#
# index.html and versions.json at the site root are regenerated on every
# publish. versions.json lists stable, latest and only the newest release of
# each major version (see .github/scripts/docs_versions.py). Older releases
# stay on the site, so saved links keep working; they are just not listed.
#
# The gh-pages branch has to exist before the first run. Create it once with:
#   git switch --orphan gh-pages
#   git commit --allow-empty -m "start gh-pages"
#   git push origin gh-pages

name: docs

on:
  push:
    branches:
      - develop
      - master
      - docs-test   # TODO: remove before opening the PR
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish. 'release' publishes the X.Y.Z tag this run is started from."
        type: choice
        options:
          - latest
          - stable
          - release
        default: latest

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      dir: ${{ steps.plan.outputs.dir }}

    steps:
      - name: plan
        id: plan
        shell: bash
        env:
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            push)
              if [ "$GITHUB_REF_NAME" = master ]; then target=stable; else target=latest; fi ;;
            release)
              target=release ;;
            *)
              target=$INPUT_TARGET ;;
          esac

          skip=false
          dir=$target
          if [ "$target" = release ]; then
            version=${GITHUB_REF_NAME#v}
            dir=v$version
            if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              # release candidates (2.1.3-rc) don't get a folder of their own
              if [ "$GITHUB_EVENT_NAME" = release ]; then
                echo "::notice::$GITHUB_REF_NAME is not an X.Y.Z release, nothing to publish"
                skip=true
              else
                echo "::error::target 'release' needs the run to be started from an X.Y.Z tag, not $GITHUB_REF_NAME"
                exit 1
              fi
            fi
          fi

          {
            echo "skip=$skip"
            echo "dir=$dir"
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest

    concurrency:
      # publishes take turns, so each one commits on top of the previous one
      group: docs-publish
      cancel-in-progress: false

    env:
      SITE_DIR: ${{ needs.plan.outputs.dir }}

    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          path: src
          persist-credentials: false

      # checked out up front so a missing gh-pages branch fails before the build
      - name: checkout-site
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: site

      - name: install-pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: setup-r
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # reticulate provisions the Python environment through uv when synapser
      # loads. Pinned to the same version as build.yml.
      - name: setup-uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"

      - name: setup-r-dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: src
          # same pkgdown version as CONTRIBUTING.md asks for
          extra-packages: pkgdown@2.2.0
          cache-version: 1

      - name: install-package
        working-directory: src
        run: R CMD INSTALL . --no-test-load

      # build into src/site-out. url is overridden so the canonical links and
      # the sitemap point at this version's folder rather than the site root.
      - name: build-site
        working-directory: src
        run: |
          Rscript -e '
            base <- sub("/$", "", pkgdown::as_pkgdown(".")$meta$url)
            pkgdown::build_site(
              new_process = FALSE,
              install = FALSE,
              override = list(
                destination = "site-out",
                url = paste0(base, "/", Sys.getenv("SITE_DIR"))
              )
            )'

      # copy the build into this version's folder, refresh the files at the
      # site root, then commit and push
      - name: publish
        shell: bash
        run: |
          set -euo pipefail

          # clear the old copy of this version's folder first, so pages dropped from
          # the build don't linger and cp doesn't nest site-out inside the folder
          rm -rf "site/$SITE_DIR"
          cp -R src/site-out "site/$SITE_DIR"
          cp src/.github/docs-site/index.html site/index.html
          touch site/.nojekyll
          # the custom domain belongs to the upstream repo only; a fork serves
          # from github.io
          if [ "$GITHUB_REPOSITORY" = Sage-Bionetworks/synapser ]; then
            echo r-docs.synapse.org > site/CNAME
          fi

          python3 src/.github/scripts/docs_versions.py update site

          cd site
          git add --all
          if git diff --cached --quiet; then
            echo "Nothing changed, the site is up to date"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "docs: publish $SITE_DIR from ${GITHUB_SHA::7}"
          git push --quiet origin HEAD:gh-pages
